<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Fira Code','Cascadia Code',Consolas,monospace; }
    .row { opacity: 0; animation: cycle 6s ease-in-out infinite; }
    .row1 { animation-delay: 0s; }
    .row2 { animation-delay: 0.8s; }
    .row3 { animation-delay: 1.6s; }
    .row4 { animation-delay: 2.4s; }
    .row5 { animation-delay: 3.2s; }
    @keyframes cycle {
      0%   { opacity: 0; }
      8%   { opacity: 1; }
      70%  { opacity: 1; }
      85%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { opacity: 0; animation: blink 1s steps(1) infinite; animation-delay: 3.6s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .dash { stroke-dasharray: 2 5; }
  </style>

  <rect x="0" y="0" width="640" height="360" rx="18" fill="#0d1117"/>

  <!-- connecting trace lines -->
  <line class="dash" x1="40" y1="74" x2="40" y2="118" stroke="#30363d" stroke-width="1.4"/>
  <line class="dash" x1="40" y1="138" x2="40" y2="182" stroke="#30363d" stroke-width="1.4"/>
  <line class="dash" x1="40" y1="202" x2="40" y2="246" stroke="#30363d" stroke-width="1.4"/>
  <line class="dash" x1="40" y1="266" x2="40" y2="310" stroke="#30363d" stroke-width="1.4"/>

  <!-- row 1: search -->
  <g class="row row1">
    <circle cx="37" cy="60" r="7.5" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <line x1="42.5" y1="65.5" x2="49" y2="72" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="66" font-size="16" fill="#c9d1d9">Indexing profile: <tspan fill="#ffffff" font-weight="600">BasirOx</tspan></text>
  </g>

  <!-- row 2: globe -->
  <g class="row row2">
    <circle cx="40" cy="128" r="9" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
    <ellipse cx="40" cy="128" rx="4" ry="9" fill="none" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="31" y1="128" x2="49" y2="128" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="70" y="134" font-size="16" fill="#c9d1d9">Connected to <tspan fill="#B300FF" font-weight="600">devxsec.com</tspan></text>
  </g>

  <!-- row 3: laptop -->
  <g class="row row3">
    <rect x="31" y="188" width="18" height="11" rx="1.5" fill="none" stroke="#00E5FF" stroke-width="1.6"/>
    <line x1="26" y1="202" x2="54" y2="202" stroke="#00E5FF" stroke-width="1.6" stroke-linecap="round"/>
    <text x="70" y="198" font-size="16" fill="#c9d1d9">Stack: <tspan fill="#ffffff" font-weight="600">Next.js</tspan> &#183; Security-first dev</text>
  </g>

  <!-- row 4: shield -->
  <g class="row row4">
    <path d="M40 253 L48 256 L48 264 C48 269 44 273 40 275 C36 273 32 269 32 264 L32 256 Z"
          fill="none" stroke="#00E5FF" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="70" y="266" font-size="16" fill="#c9d1d9">Founder @ <tspan fill="#B300FF" font-weight="600">DEVXSEC</tspan></text>
  </g>

  <!-- row 5: status / bolt -->
  <g class="row row5">
    <path d="M43 306 L35 319 L40 319 L38 330 L48 315 L42 315 Z" fill="#00E5FF"/>
    <text x="70" y="322" font-size="16" fill="#c9d1d9">Status: <tspan fill="#00E5FF" font-weight="600">Ready to build</tspan><tspan class="cursor" fill="#00E5FF">_</tspan></text>
  </g>
</svg>
