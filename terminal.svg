<svg width="800" height="540" viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#121a12" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Fira Code','Cascadia Code',Consolas,monospace; }
    .label { fill: #c9ffcb; font-size: 13px; font-weight: 600; }
    .sub { fill: #5c8f5c; font-size: 10px; }
    .proto { fill: #3a5a3a; font-size: 10px; }
    .node-cyan  { stroke: #00e5ff; }
    .node-green { stroke: #39ff14; }
    .node-purple{ stroke: #b388ff; }
    .flow { stroke-dasharray: 4 6; animation: dash 2.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .pulseNode { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .hexPulse { animation: hexpulse 3s ease-in-out infinite; transform-origin: 400px 300px; }
    @keyframes hexpulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.03); opacity: 0.85; } }
  </style>

  <!-- terminal frame -->
  <rect x="0" y="0" width="800" height="540" rx="12" fill="#0a0e0a"/>
  <rect x="0" y="0" width="800" height="34" rx="12" fill="#111511"/>
  <rect x="0" y="22" width="800" height="12" fill="#111511"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="21" font-size="12" fill="#5c6b5c" text-anchor="middle">root@basirox: network-map</text>
  <rect x="0.5" y="0.5" width="799" height="539" rx="12" fill="none" stroke="#1a2b1a" stroke-width="1"/>

  <!-- grid background -->
  <rect x="0" y="34" width="800" height="506" fill="url(#grid)"/>

  <!-- faint hex decoration -->
  <text x="40" y="510" font-size="10" fill="#12351c">0x7F3A &#183; SEC-CTX-01</text>
  <text x="650" y="60"  font-size="10" fill="#12351c">TLS1.3 &#183; AES-256</text>

  <!-- connection lines (drawn first, nodes on top) -->
  <g stroke-width="1.6" fill="none">
    <line class="flow node-green"  x1="400" y1="300" x2="400" y2="118" stroke-width="1.4"/>
    <line class="flow node-cyan"   x1="400" y1="300" x2="620" y2="198" stroke-width="1.4"/>
    <line class="flow node-cyan"   x1="400" y1="300" x2="620" y2="402" stroke-width="1.4"/>
    <line class="flow node-purple" x1="400" y1="300" x2="400" y2="482" stroke-width="1.4"/>
    <line class="flow node-purple" x1="400" y1="300" x2="180" y2="402" stroke-width="1.4"/>
    <line class="flow node-green"  x1="400" y1="300" x2="180" y2="198" stroke-width="1.4"/>
  </g>

  <!-- traveling pulse dots -->
  <circle r="3" fill="#39ff14"><animateMotion dur="2.4s" repeatCount="indefinite" path="M400,300 L400,118"/></circle>
  <circle r="3" fill="#00e5ff"><animateMotion dur="2.6s" repeatCount="indefinite" path="M400,300 L620,198"/></circle>
  <circle r="3" fill="#00e5ff"><animateMotion dur="2.8s" repeatCount="indefinite" path="M400,300 L620,402"/></circle>
  <circle r="3" fill="#b388ff"><animateMotion dur="3s"   repeatCount="indefinite" path="M400,300 L400,482"/></circle>
  <circle r="3" fill="#b388ff"><animateMotion dur="2.5s" repeatCount="indefinite" path="M400,300 L180,402"/></circle>
  <circle r="3" fill="#39ff14"><animateMotion dur="2.3s" repeatCount="indefinite" path="M400,300 L180,198"/></circle>

  <!-- protocol tags on lines -->
  <text x="410" y="200" class="proto">WSS</text>
  <text x="500" y="235" class="proto">TCP/443</text>
  <text x="500" y="375" class="proto">gRPC</text>
  <text x="410" y="400" class="proto">TLS</text>
  <text x="255" y="375" class="proto">SSH/22</text>
  <text x="255" y="235" class="proto">HTTPS</text>

  <!-- central API hub -->
  <g class="hexPulse">
    <circle cx="400" cy="300" r="80" fill="url(#hubGlow)"/>
    <polygon points="400,247 447,273.5 447,326.5 400,353 353,326.5 353,273.5"
             fill="#0a0e0a" stroke="#39ff14" stroke-width="2"/>
    <text x="400" y="296" text-anchor="middle" font-size="15" fill="#39ff14" font-weight="700">API</text>
    <text x="400" y="313" text-anchor="middle" font-size="9" fill="#5c8f5c">GATEWAY</text>
  </g>

  <!-- Mobile (top) -->
  <g class="pulseNode">
    <circle cx="400" cy="90" r="40" fill="#0a0e0a" stroke="#39ff14" stroke-width="1.6"/>
    <rect x="391" y="74" width="18" height="32" rx="3" fill="none" stroke="#39ff14" stroke-width="1.6"/>
    <circle cx="400" cy="101" r="1.4" fill="#39ff14"/>
    <text x="400" y="146" text-anchor="middle" class="label">Mobile</text>
  </g>

  <!-- Server (upper right) -->
  <g class="pulseNode">
    <circle cx="620" cy="170" r="40" fill="#0a0e0a" stroke="#00e5ff" stroke-width="1.6"/>
    <rect x="605" y="156" width="30" height="8" rx="1.5" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
    <rect x="605" y="166" width="30" height="8" rx="1.5" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
    <rect x="605" y="176" width="30" height="8" rx="1.5" fill="none" stroke="#00e5ff" stroke-width="1.4"/>
    <circle cx="610" cy="160" r="1.2" fill="#00e5ff"/>
    <circle cx="610" cy="170" r="1.2" fill="#00e5ff"/>
    <circle cx="610" cy="180" r="1.2" fill="#00e5ff"/>
    <text x="620" y="226" text-anchor="middle" class="label">Server</text>
  </g>

  <!-- Cloud (lower right) -->
  <g class="pulseNode">
    <circle cx="620" cy="430" r="40" fill="#0a0e0a" stroke="#00e5ff" stroke-width="1.6"/>
    <path d="M600,440 C592,440 592,428 600,427 C600,418 614,415 619,422 C627,417 638,423 636,431 C642,432 642,440 635,440 Z"
          fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="620" y="486" text-anchor="middle" class="label">Cloud</text>
  </g>

  <!-- Database (bottom) -->
  <g class="pulseNode">
    <circle cx="400" cy="510" r="40" fill="#0a0e0a" stroke="#b388ff" stroke-width="1.6"/>
    <ellipse cx="400" cy="497" rx="16" ry="6" fill="none" stroke="#b388ff" stroke-width="1.5"/>
    <line x1="384" y1="497" x2="384" y2="519" stroke="#b388ff" stroke-width="1.5"/>
    <line x1="416" y1="497" x2="416" y2="519" stroke="#b388ff" stroke-width="1.5"/>
    <path d="M384,519 A16,6 0 0 0 416,519" fill="none" stroke="#b388ff" stroke-width="1.5"/>
    <text x="400" y="536" text-anchor="middle" class="label" style="display:none"></text>
  </g>
  <text x="400" y="536" text-anchor="middle" class="label" fill="#c9ffcb">Database</text>

  <!-- Firewall (lower left) -->
  <g class="pulseNode">
    <circle cx="180" cy="430" r="40" fill="#0a0e0a" stroke="#b388ff" stroke-width="1.6"/>
    <path d="M180,412 L192,417 L192,433 C192,441 187,446 180,449 C173,446 168,441 168,433 L168,417 Z"
          fill="none" stroke="#b388ff" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="174" y1="430" x2="186" y2="430" stroke="#b388ff" stroke-width="1.3"/>
    <line x1="180" y1="424" x2="180" y2="436" stroke="#b388ff" stroke-width="1.3"/>
    <text x="180" y="486" text-anchor="middle" class="label">Firewall</text>
  </g>

  <!-- Laptop (upper left) -->
  <g class="pulseNode">
    <circle cx="180" cy="170" r="40" fill="#0a0e0a" stroke="#39ff14" stroke-width="1.6"/>
    <rect x="166" y="155" width="28" height="18" rx="1.5" fill="none" stroke="#39ff14" stroke-width="1.6"/>
    <path d="M162,178 L198,178 L202,184 L158,184 Z" fill="none" stroke="#39ff14" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="226" text-anchor="middle" class="label">Laptop</text>
  </g>

  <!-- footer prompt -->
  <text x="24" y="524" font-size="12"><tspan fill="#39ff14" font-weight="600">root@kali:~$</tspan><tspan fill="#5c8f5c" dx="8">tracing all active connections...</tspan></text>
</svg>
