<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Fira Code','Cascadia Code',Consolas,monospace; }
    .row { opacity: 0; animation: cycle 18s ease-in-out infinite; }
    .row1 { animation-delay: 0s; }
    .row2 { animation-delay: 3s; }
    .row3 { animation-delay: 6s; }
    .row4 { animation-delay: 9s; }
    .row5 { animation-delay: 12s; }
    .row6 { animation-delay: 15s; }
    @keyframes cycle {
      0%     { opacity: 0; }
      1.1%   { opacity: 1; }
      14.4%  { opacity: 1; }
      16.7%  { opacity: 0; }
      100%   { opacity: 0; }
    }
    .cursor { opacity: 0; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .prompt { fill: #39ff14; font-weight: 600; }
  </style>

  <!-- terminal window -->
  <rect x="0" y="0" width="640" height="360" rx="12" fill="#0a0e0a"/>
  <rect x="0" y="0" width="640" height="34" rx="12" fill="#111511"/>
  <rect x="0" y="22" width="640" height="12" fill="#111511"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="320" y="21" font-size="12" fill="#5c6b5c" text-anchor="middle">root@basirox: ~</text>
  <rect x="0.5" y="0.5" width="639" height="359" rx="12" fill="none" stroke="#1a2b1a" stroke-width="1"/>

  <!-- faint decorative binary rain, kept clear of text column -->
  <text x="572" y="70"  font-size="11" fill="#12351c">01001010</text>
  <text x="572" y="90"  font-size="11" fill="#12351c">11010011</text>
  <text x="572" y="110" font-size="11" fill="#12351c">00110101</text>
  <text x="572" y="130" font-size="11" fill="#12351c">10101100</text>

  <!-- row 1 -->
  <g class="row row1">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">nmap -sV -T4 devxsec.com</tspan></text>
    <text x="24" y="106" font-size="13" fill="#5c8f5c">PORT 443/tcp open https &#183; scanning services...</text>
  </g>

  <!-- row 2 -->
  <g class="row row2">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">whoami</tspan></text>
    <text x="24" y="106" font-size="15" fill="#ffffff" font-weight="600">BasirOx</text>
  </g>

  <!-- row 3 -->
  <g class="row row3">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">cat stack.txt</tspan></text>
    <text x="24" y="106" font-size="15" fill="#c9ffcb">Next.js &#183; Node &#183; Security-first dev</text>
  </g>

  <!-- row 4 -->
  <g class="row row4">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">sudo access --grant</tspan></text>
    <text x="24" y="106" font-size="14" fill="#39ff14" class="glow">[ OK ] access granted: full permissions</text>
  </g>

  <!-- row 5 -->
  <g class="row row5">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">ping devxsec.com</tspan></text>
    <text x="24" y="106" font-size="13" fill="#5c8f5c">64 bytes from devxsec.com: time=4ms &#183; connection stable</text>
  </g>

  <!-- row 6: status -->
  <g class="row row6">
    <text x="24" y="80"  font-size="15"><tspan class="prompt">root@kali:~$</tspan><tspan fill="#c9ffcb" dx="8">echo $STATUS</tspan></text>
    <text x="24" y="106" font-size="15" fill="#39ff14" font-weight="600">Ready to build<tspan class="cursor" fill="#39ff14">_</tspan></text>
  </g>

  <!-- static footer prompt -->
  <text x="24" y="330" font-size="14"><tspan class="prompt">root@kali:~$</tspan><tspan class="cursor" fill="#39ff14" dx="8">_</tspan></text>
</svg>
